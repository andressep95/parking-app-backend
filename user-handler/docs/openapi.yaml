openapi: "3.0.3"

info:
  title: parking-app — User Handler API
  version: "1.0.0"
  description: |
    Endpoints de gestión de usuarios (CRUD).

    Implementados como una sola Lambda Go (`user-handler`) detrás de API Gateway HTTP v2.
    **Todos los endpoints requieren autenticación JWT** (Bearer token de Cognito).

    ## Autorización por rol

    | Endpoint | ADMIN | CUSTOMER | CUSTOMER_OPERATOR |
    |---|---|---|---|
    | GET /users | ✅ (todos o filtrado) | ✅ (sus operadores, customer_id requerido) | ❌ |
    | GET /users/{id} | ✅ | ✅ | ✅ (solo sí mismo) |
    | PUT /users/{id} | ✅ | ✅ | ✅ (solo sí mismo) |
    | POST /users/{id}/activate | ✅ | ✅ | ❌ |
    | POST /users/{id}/deactivate | ✅ | ✅ | ❌ |
    | POST /users/{id}/reset-password | ✅ | ❌ | ❌ |
    | DELETE /users/{id} | ✅ | ❌ | ❌ |

    Los roles se leen del claim `cognito:groups` del JWT del request
    (inyectado por API Gateway a través de `event.RequestContext.Authorizer.JWT.Claims`).

servers:
  - url: https://qnehzrs7g4.execute-api.us-east-1.amazonaws.com
    description: dev

tags:
  - name: Users
    description: CRUD de usuarios del sistema

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT emitido por Cognito. Obtener desde POST /api/v1/auth/login.

  schemas:

    UserResponse:
      type: object
      required: [id, rut, email, given_name, family_name, role, status, created_at]
      properties:
        id:
          type: string
          format: uuid
          description: ID interno del usuario en DynamoDB.
          example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
        rut:
          type: string
          description: RUT chileno normalizado (username en Cognito).
          example: "12345678-5"
        email:
          type: string
          format: email
          example: "juan.perez@empresa.cl"
        given_name:
          type: string
          example: "Juan"
        family_name:
          type: string
          example: "Pérez"
        phone_number:
          type: string
          description: Presente solo si el usuario tiene teléfono registrado.
          example: "+56912345678"
        role:
          type: string
          enum: [ADMIN, CUSTOMER, CUSTOMER_OPERATOR]
          example: "CUSTOMER_OPERATOR"
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
          example: "ACTIVE"
        customer_id:
          type: string
          format: uuid
          description: Presente si el usuario pertenece a un cliente.
          example: "c0c0c0c0-0000-0000-0000-000000000000"
        location_id:
          type: string
          format: uuid
          description: Presente si el operador tiene una ubicación asignada.
          example: "l1l1l1l1-0000-0000-0000-000000000000"
        created_at:
          type: string
          format: date-time
          example: "2026-06-16T10:00:00Z"

    UpdateUserRequest:
      type: object
      description: Todos los campos son opcionales. Al menos uno debe estar presente.
      properties:
        email:
          type: string
          format: email
          example: "nuevo.email@empresa.cl"
        given_name:
          type: string
          example: "Juan Carlos"
        family_name:
          type: string
          example: "Pérez González"
        phone_number:
          type: string
          pattern: "^\\+[1-9]\\d{1,14}$"
          example: "+56987654321"
        location_id:
          type: string
          format: uuid
          description: Reasignar la ubicación del operador.
          example: "l2l2l2l2-0000-0000-0000-000000000000"

    ResetPasswordRequest:
      type: object
      required: [new_password]
      properties:
        new_password:
          type: string
          format: password
          minLength: 8
          description: Nueva contraseña permanente. Debe cumplir la política de Cognito.
          example: "NuevoPass456!"

    StatusResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
          example: "ACTIVE"

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Código de error en snake_case.
          example: "sin_permiso"

security:
  - BearerAuth: []

paths:

  /api/v1/users:
    get:
      tags: [Users]
      summary: Listar usuarios
      description: |
        Lista usuarios del sistema.

        - **ADMIN sin `customer_id`:** devuelve hasta 50 usuarios (scan).
        - **ADMIN con `customer_id`:** devuelve los operadores de ese cliente.
        - **CUSTOMER:** `customer_id` es obligatorio y debe ser el de su empresa.
        - **CUSTOMER_OPERATOR:** acceso denegado (`403`).
      operationId: listUsers
      parameters:
        - name: customer_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: |
            Filtrar por cliente. Requerido para CUSTOMER.
            ADMIN puede omitirlo para un scan global (máx 50 resultados).
          example: "c0c0c0c0-0000-0000-0000-000000000000"
      responses:
        "200":
          description: Lista de usuarios (puede estar vacía)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserResponse"
        "400":
          description: customer_id requerido (solo para CUSTOMER)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "customer_id_requerido"
        "403":
          description: Sin permiso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "sin_permiso"
        "500":
          description: Error interno
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "error_al_listar"

  /api/v1/users/{id}:
    get:
      tags: [Users]
      summary: Obtener usuario por ID
      description: |
        Obtiene un usuario por su ID interno (UUID de DynamoDB).

        - **CUSTOMER_OPERATOR:** solo puede obtener su propio perfil.
          Si intenta obtener el de otro usuario recibe `403`.
      operationId: getUser
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
      responses:
        "200":
          description: Usuario encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "403":
          description: Sin permiso (operador accediendo al perfil de otro usuario)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "sin_permiso"
        "404":
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "usuario_no_encontrado"
        "500":
          description: Error interno
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "error_al_obtener_usuario"

    put:
      tags: [Users]
      summary: Actualizar usuario
      description: |
        Actualiza uno o más campos del usuario. Usa DynamoDB expression builder
        para manejar atributos con nombres reservados.

        - **CUSTOMER_OPERATOR:** solo puede actualizar su propio perfil.
        - `role` no se puede cambiar desde este endpoint
          (usar register o Cognito Admin API).
      operationId: updateUser
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
            example:
              given_name: "Juan Carlos"
              phone_number: "+56987654321"
      responses:
        "200":
          description: Usuario actualizado (devuelve el ítem con los nuevos valores)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: Body inválido o sin campos para actualizar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                body_invalido:
                  value: { error: "body_invalido" }
                sin_campos:
                  value: { error: "sin_campos_para_actualizar" }
        "403":
          description: Sin permiso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "sin_permiso"
        "404":
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "usuario_no_encontrado"
        "500":
          description: Error interno
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "error_al_actualizar"

    delete:
      tags: [Users]
      summary: Eliminar usuario
      description: |
        Elimina el usuario de DynamoDB y de Cognito.
        **Solo ADMIN** puede realizar esta operación.

        La eliminación de Cognito es definitiva — el usuario no puede recuperar
        acceso sin volver a registrarse.
      operationId: deleteUser
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
      responses:
        "200":
          description: Usuario eliminado
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "usuario_eliminado"
        "403":
          description: Sin permiso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "sin_permiso"
        "404":
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "usuario_no_encontrado"
        "500":
          description: Error interno (DynamoDB o Cognito)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                dynamo:
                  value: { error: "error_al_eliminar" }
                cognito:
                  value: { error: "error_al_eliminar_cognito" }

  /api/v1/users/{id}/activate:
    post:
      tags: [Users]
      summary: Activar usuario
      description: |
        Activa el usuario: establece `user_status = ACTIVE` en DynamoDB
        y llama `AdminEnableUser` en Cognito.

        Requiere rol **ADMIN** o **CUSTOMER**.
      operationId: activateUser
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Usuario activado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
              example:
                status: "ACTIVE"
        "403":
          description: Sin permiso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "sin_permiso"
        "404":
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "usuario_no_encontrado"
        "500":
          description: Error interno (DynamoDB o Cognito)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                dynamo:
                  value: { error: "error_al_actualizar_estado" }
                cognito:
                  value: { error: "error_al_actualizar_cognito" }

  /api/v1/users/{id}/deactivate:
    post:
      tags: [Users]
      summary: Desactivar usuario
      description: |
        Desactiva el usuario: establece `user_status = INACTIVE` en DynamoDB
        y llama `AdminDisableUser` en Cognito. El usuario pierde acceso
        inmediatamente (tokens existentes pueden seguir válidos hasta que expiren).

        Requiere rol **ADMIN** o **CUSTOMER**.
      operationId: deactivateUser
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Usuario desactivado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
              example:
                status: "INACTIVE"
        "403":
          description: Sin permiso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "sin_permiso"
        "404":
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "usuario_no_encontrado"
        "500":
          description: Error interno (DynamoDB o Cognito)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/users/{id}/reset-password:
    post:
      tags: [Users]
      summary: Resetear contraseña
      description: |
        Fuerza el cambio de contraseña de un usuario vía `AdminSetUserPassword`
        con `Permanent: true`. No envía email al usuario.

        **Solo ADMIN** puede usar este endpoint.
      operationId: resetPassword
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
            example:
              new_password: "NuevoPass456!"
      responses:
        "200":
          description: Contraseña actualizada
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "password_actualizado"
        "400":
          description: Body inválido o contraseña faltante
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "new_password_requerido"
        "403":
          description: Sin permiso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "sin_permiso"
        "404":
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "usuario_no_encontrado"
        "500":
          description: Error de Cognito al cambiar contraseña
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "error_al_resetear_password"
