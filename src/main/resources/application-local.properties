# =============================================================================
# Perfil LOCAL — sobreescribe application.properties para desarrollo en máquina
# Activar con: -Dspring.profiles.active=local  o  SPRING_PROFILES_ACTIVE=local
# =============================================================================

# PostgreSQL (Docker Compose local)
spring.datasource.url=jdbc:postgresql://localhost:5432/parking_app
spring.datasource.username=parking_user
spring.datasource.password=parking_pass

# -----------------------------------------------------------------------------
# AWS Credentials — leídas por DefaultCredentialsProvider del SDK v2
#
# Las credenciales NO van aquí — Spring Boot no las inyecta al SDK de AWS.
# Configurar como variables de entorno ANTES de levantar la app:
#
#   export AWS_ACCESS_KEY_ID=AKIA...
#   export AWS_SECRET_ACCESS_KEY=...
#   export AWS_REGION=us-east-1
#
# O en el Run Configuration del IDE (IntelliJ: Edit Configurations → Env vars).
# O via ~/.aws/credentials con el perfil [default] si usas aws configure.
#
# IAM user recomendado: parking-app-backend (policy acotada al user pool)
# User Pool ARN: arn:aws:cognito-idp:us-east-1:970547363172:userpool/us-east-1_5Hq8VEHuN
# -----------------------------------------------------------------------------
aws.region=us-east-1

# Cognito — cliente POS/backend (ADMIN_USER_PASSWORD_AUTH via IAM)
# Este client ID es el que Spring Boot usa para AdminInitiateAuth.
# El WebClientId (5hhp0t1m5jd5hd77t6iao59bnl) es solo para Amplify/frontend.
aws.cognito.user-pool-id=us-east-1_5Hq8VEHuN
aws.cognito.client-id=1d2sil9s35rb6b6t02c647co98

# CORS — orígenes permitidos en desarrollo local
cors.allowed-origins=http://localhost:3000

# Log SQL en local para ver las queries de JdbcClient
logging.level.org.springframework.jdbc=DEBUG
