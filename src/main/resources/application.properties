spring.application.name=parking-app
server.servlet.context-path=/api/v1

# PostgreSQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# AWS Cognito — OAuth2 Resource Server (JWT)
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://cognito-idp.us-east-1.amazonaws.com/${COGNITO_USER_POOL_ID}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://cognito-idp.us-east-1.amazonaws.com/${COGNITO_USER_POOL_ID}/.well-known/jwks.json

# Cognito metadata
aws.cognito.user-pool-id=${COGNITO_USER_POOL_ID}
aws.cognito.client-id=${COGNITO_CLIENT_ID}
aws.cognito.web-client-id=${COGNITO_WEB_CLIENT_ID}
aws.region=${AWS_REGION}

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
